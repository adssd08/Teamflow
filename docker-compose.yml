services:
  postgres:
    image: postgres:16
    container_name: teamflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow_postgres_data:/var/lib/postgresql/data

volumes:
  teamflow_postgres_data: